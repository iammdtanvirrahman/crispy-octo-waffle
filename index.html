<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Voxel World</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
    #game{position:fixed;inset:0}
    #hud{position:fixed;inset:0;pointer-events:none;color:#fff}
    #crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
    #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;opacity:.9}
    #crosshair:before{left:8px;top:2px;width:2px;height:14px}.crosshair{}
    #crosshair:after{left:2px;top:8px;width:14px;height:2px}
    #help{position:absolute;top:16px;left:16px;padding:10px 13px;border:1px solid #ffffff22;border-radius:12px;background:#0008;backdrop-filter:blur(8px);font-size:12px;line-height:1.55}
    #hotbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:#0009;border:1px solid #ffffff20;border-radius:12px}
    .slot{width:42px;height:42px;display:grid;place-items:center;border:2px solid #ffffff22;border-radius:7px;background:#111b;font-size:11px}.slot.active{border-color:#fff}
    #lock{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#0004,#000b)}
    #lock button{pointer-events:auto;border:1px solid #ffffff33;background:#ffffff12;color:#fff;padding:13px 20px;border-radius:14px;font-size:15px;cursor:pointer;backdrop-filter:blur(10px)}
  </style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div id="help">WASD move · Space jump · Mouse look<br>Left click break · Right click place · 1–5 select</div><div id="crosshair"></div><div id="hotbar"></div></div>
<div id="lock"><button>CLICK TO PLAY</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fc8ff);scene.fog=new THREE.Fog(0x8fc8ff,35,95);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,180);
camera.position.set(0,3,7);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2.1));
const sun=new THREE.DirectionalLight(0xffffff,1.25);sun.position.set(30,60,20);scene.add(sun);

const blocks=[
 {id:'grass',label:'Grass',color:0x66a844,top:0x78bd55},
 {id:'dirt',label:'Dirt',color:0x8b5a35},
 {id:'stone',label:'Stone',color:0x85888c},
 {id:'wood',label:'Wood',color:0x9a6a3a},
 {id:'sand',label:'Sand',color:0xd8c17a}
];
const materials={};
for(const b of blocks){materials[b.id]=new THREE.MeshLambertMaterial({color:b.color});}
materials.grassTop=new THREE.MeshLambertMaterial({color:blocks[0].top});
const cubeGeo=new THREE.BoxGeometry(1,1,1);
const world=new Map();
const key=(x,y,z)=>`${x}|${y}|${z}`;
function setBlock(x,y,z,type){if(type)world.set(key(x,y,z),type);else world.delete(key(x,y,z));}
function getBlock(x,y,z){return world.get(key(x,y,z));}
function generate(){
 const size=28;
 for(let x=-size;x<=size;x++)for(let z=-size;z<=size;z++){
   const h=Math.max(1,Math.floor(3+Math.sin(x*.22)*.8+Math.cos(z*.18)*.65+Math.sin((x+z)*.11)*.5));
   for(let y=0;y<=h;y++)setBlock(x,y,z,y===h?'grass':y>=h-2?'dirt':'stone');
   if(Math.random()<.025 && h>=3 && Math.abs(x)<22 && Math.abs(z)<22){for(let y=1;y<=4;y++)setBlock(x,h+y,z,'wood'); for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)if(Math.abs(dx)+Math.abs(dz)<4)setBlock(x+dx,h+4,z+dz,'grass');}
 }
}
generate();
const meshes=new Map();
function rebuild(){for(const m of meshes.values())scene.remove(m);meshes.clear();for(const [k,type] of world){const [x,y,z]=k.split('|').map(Number);const m=new THREE.Mesh(cubeGeo, type==='grass'?materials.grass:materials[type]);m.position.set(x+.5,y+.5,z+.5);m.userData={x,y,z,type};scene.add(m);meshes.set(k,m);}}
rebuild();

const player={pos:new THREE.Vector3(0,6,7),vel:new THREE.Vector3(),yaw:Math.PI,pitch:0,onGround:false};
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-5]$/.test(e.code))select(+e.code.slice(-1)-1);});
addEventListener('keyup',e=>keys[e.code]=false);
let selected=0;const hotbar=document.querySelector('#hotbar');
function renderHotbar(){hotbar.innerHTML='';blocks.forEach((b,i)=>{const s=document.createElement('div');s.className='slot'+(i===selected?' active':'');s.textContent=(i+1)+' '+b.label;hotbar.appendChild(s);});}function select(i){selected=Math.max(0,Math.min(blocks.length-1,i));renderHotbar();}renderHotbar();

const lock=document.querySelector('#lock');
lock.addEventListener('click',()=>renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange',()=>lock.style.display=document.pointerLockElement?'none':'grid');
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;player.yaw-=e.movementX*.0025;player.pitch-=e.movementY*.0025;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch));});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
const ray=new THREE.Raycaster();
function target(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects([...meshes.values()],false)[0];}
renderer.domElement.addEventListener('mousedown',e=>{if(!document.pointerLockElement)return;const hit=target();if(!hit)return;const b=hit.object.userData;
 if(e.button===0){setBlock(b.x,b.y,b.z,null);rebuild();}
 if(e.button===2){const n=hit.face.normal.clone();const x=b.x+n.x,y=b.y+n.y,z=b.z+n.z;if(!getBlock(x,y,z)){setBlock(x,y,z,blocks[selected].id);rebuild();}}
});

function solidAt(x,y,z){return !!getBlock(Math.floor(x),Math.floor(y),Math.floor(z));}
function collideY(){const p=player.pos;const feet=p.y-.9; if(solidAt(p.x-.25,feet,p.z-.25)||solidAt(p.x+.25,feet,p.z-.25)||solidAt(p.x-.25,feet,p.z+.25)||solidAt(p.x+.25,feet,p.z+.25)) return true;return false;}
function move(dt){
 const dir=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(dir.lengthSq())dir.normalize();
 const sin=Math.sin(player.yaw),cos=Math.cos(player.yaw);const dx=dir.x*cos-dir.z*sin,dz=dir.x*sin+dir.z*cos;const speed=5.6;player.pos.x+=dx*speed*dt;player.pos.z+=dz*speed*dt;
 player.vel.y-=18*dt;if(keys.Space&&player.onGround){player.vel.y=7.2;player.onGround=false;}player.pos.y+=player.vel.y*dt;
 if(collideY()&&player.vel.y<=0){player.pos.y=Math.floor(player.pos.y-.9)+1.9;player.vel.y=0;player.onGround=true;}else player.onGround=false;
 player.pos.x=Math.max(-27.2,Math.min(27.2,player.pos.x));player.pos.z=Math.max(-27.2,Math.min(27.2,player.pos.z));
 camera.position.copy(player.pos);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;
}
let last=performance.now();function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;move(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
