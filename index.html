<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#8ec6ff"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Voxel Frontier</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#080b10b8;border:1px solid #ffffff1f;box-shadow:0 10px 35px #0004;backdrop-filter:blur(10px)}#top,#stats{position:absolute;top:16px;padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.5}#top{left:16px}#stats{right:16px;min-width:150px}.stat{margin:2px 0}#crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;opacity:.9}#crosshair:before{left:8px;top:1px;width:2px;height:16px}#crosshair:after{left:1px;top:8px;width:16px;height:2px}#target{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-size:11px;background:#0008;padding:4px 8px;border-radius:7px;display:none}#hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border-radius:13px}.slot{position:relative;width:58px;height:50px;display:grid;place-items:end center;padding-bottom:5px;border:2px solid #ffffff22;border-radius:8px;background:#0f1217dd;font-size:10px}.slot b{position:absolute;left:5px;top:3px;font-size:10px;color:#bbb}.slot.active{border-color:#fff;transform:translateY(-3px)}.swatch{position:absolute;top:9px;width:24px;height:15px;border-radius:3px}#lock{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#0002,#000c);pointer-events:auto}#lock .card{padding:30px 34px;border-radius:18px;text-align:center;max-width:380px}.title{font-size:28px;font-weight:800}.sub{opacity:.72;margin:8px 0 18px;font-size:13px;line-height:1.5}button{border:1px solid #ffffff33;background:#ffffff12;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:700}#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;opacity:0;transition:opacity .2s;font-size:12px}#save{position:absolute;left:16px;bottom:16px;padding:7px 9px;border-radius:8px;font-size:10px;opacity:.65}
</style>
</head>
<body>
<div id="game"></div><div id="hud">
<div id="top" class="panel"><b>VOXEL FRONTIER</b><br>WASD move · Shift sprint · Ctrl crouch · Space jump<br>LMB mine · RMB place · 1–6 select · F3 debug · P save</div>
<div id="stats" class="panel"><div class="stat">❤️ <span id="hp">100</span></div><div class="stat">🍗 <span id="food">100</span></div><div class="stat">☀️ <span id="clock">06:00</span></div><div class="stat">Chunks: <span id="chunks">0</span></div><div class="stat">FPS: <span id="fps">0</span></div><div class="stat">Seed: <span id="seed"></span></div></div>
<div id="crosshair"></div><div id="target"></div><div id="hotbar" class="panel"></div><div id="toast" class="panel"></div><div id="save">CHUNK STREAMING · LOCAL WORLD</div>
</div><div id="lock"><div class="card panel"><div class="title">VOXEL FRONTIER</div><div class="sub">Optimized voxel world with streamed chunks. Explore, mine and build.</div><button id="play">CLICK TO ENTER WORLD</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {ChunkWorld,BLOCKS,CHUNK_HEIGHT} from './web/chunk-world.js';

const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,220);
scene.background=new THREE.Color(0x8ec6ff);scene.fog=new THREE.Fog(0x8ec6ff,45,180);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x51633d,1.8));const sun=new THREE.DirectionalLight(0xffffff,1.25);sun.position.set(35,60,20);scene.add(sun);
let seed=Number(localStorage.getItem('vf-seed'))||Math.floor(Math.random()*1e9);localStorage.setItem('vf-seed',seed);document.querySelector('#seed').textContent=seed;
const world=new ChunkWorld(scene,seed);world.renderRadius=4;world.stream(0,0);
const names=['','Grass','Dirt','Stone','Wood','Sand','Leaves'];let selected=1;const hotbar=document.querySelector('#hotbar');
function renderHotbar(){hotbar.innerHTML='';for(let i=1;i<BLOCKS.length;i++){const s=document.createElement('div');s.className='slot'+(i===selected?' active':'');s.innerHTML=`<b>${i}</b><span class="swatch" style="background:#${BLOCKS[i].color.toString(16).padStart(6,'0')}"></span>${names[i]}`;hotbar.appendChild(s)}}renderHotbar();
const player={pos:new THREE.Vector3(.5,20,.5),vel:new THREE.Vector3(),yaw:Math.PI,pitch:0,onGround:false,crouch:false};const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){const n=Number(e.code.slice(5));if(n>=1&&n<BLOCKS.length){selected=n;renderHotbar()}}if(e.code==='KeyP')saveWorld();if(e.code==='F3')document.querySelector('#top').style.display=document.querySelector('#top').style.display==='none'?'block':'none'});addEventListener('keyup',e=>keys[e.code]=false);
const lock=document.querySelector('#lock');document.querySelector('#play').onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('pointerlockchange',()=>lock.style.display=document.pointerLockElement?'none':'grid');document.addEventListener('mousemove',e=>{if(!document.pointerLockElement)return;player.yaw-=e.movementX*.0024;player.pitch-=e.movementY*.0024;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch))});renderer.oncontextmenu=e=>e.preventDefault();
function solid(x,y,z){return world.getBlock(Math.floor(x),Math.floor(y),Math.floor(z))!==0}
function collides(nx,ny,nz){const r=.28,h=player.crouch?.7:.9;for(const [x,z] of [[nx-r,nz-r],[nx+r,nz-r],[nx-r,nz+r],[nx+r,nz+r]])if(solid(x,ny-h,z)||solid(x,ny-.15,z)||solid(x,ny+h-.05,z))return true;return false}
function move(dt){const dir=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(dir.lengthSq())dir.normalize();player.crouch=!!(keys.ControlLeft||keys.ControlRight);const speed=(keys.ShiftLeft||keys.ShiftRight?7.5:player.crouch?2.6:5.2);const s=Math.sin(player.yaw),c=Math.cos(player.yaw);const dx=dir.x*c-dir.z*s,dz=dir.x*s+dir.z*c;let nx=player.pos.x+dx*speed*dt,nz=player.pos.z+dz*speed*dt;if(!collides(nx,player.pos.y,nz)){player.pos.x=nx;player.pos.z=nz}player.vel.y-=20*dt;if(keys.Space&&player.onGround&&!player.crouch){player.vel.y=7;player.onGround=false}const oldY=player.pos.y,ny=oldY+player.vel.y*dt;if(!collides(player.pos.x,ny,player.pos.z)){player.pos.y=ny;player.onGround=false}else{if(player.vel.y<0)player.onGround=true;player.vel.y=0}if(player.pos.y<-8){player.pos.set(.5,22,.5);player.vel.set(0,0,0)}camera.position.set(player.pos.x,player.pos.y+(player.crouch?.25:.65),player.pos.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}
const ray=new THREE.Raycaster();function hit(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects([...world.chunks.values()].map(c=>c.mesh).filter(Boolean),false).find(h=>h.distance<7)}
let mining=false,miningTarget='',miningT=0;
renderer.domElement.addEventListener('mousedown',e=>{if(!document.pointerLockElement)return;if(e.button===0)mining=true;if(e.button===2){const h=hit();if(!h)return;const p=h.point.clone().addScaledVector(h.face.normal,.001);const x=Math.floor(p.x),y=Math.floor(p.y),z=Math.floor(p.z);if(y<0||y>=CHUNK_HEIGHT)return;const px=Math.abs(x+.5-player.pos.x),pz=Math.abs(z+.5-player.pos.z);if(px<.8&&pz<.8&&y<player.pos.y+1)return;world.setBlock(x,y,z,selected)}});addEventListener('mouseup',e=>{if(e.button===0){mining=false;miningTarget='';miningT=0}});
function mine(dt){if(!mining)return;const h=hit();if(!h){miningTarget='';miningT=0;return}const p=h.point.clone().addScaledVector(h.face.normal,-.001),x=Math.floor(p.x),y=Math.floor(p.y),z=Math.floor(p.z),id=`${x}|${y}|${z}`;if(id!==miningTarget){miningTarget=id;miningT=0}const b=world.getBlock(x,y,z);miningT+=dt*(b===3?1:2);if(miningT>.45){world.setBlock(x,y,z,0);miningTarget='';miningT=0}}
let worldTime=6*60;function dayNight(dt){worldTime=(worldTime+dt*2)%1440;const a=worldTime/1440*Math.PI*2-Math.PI/2;sun.position.set(Math.cos(a)*50,Math.sin(a)*60,20);const d=Math.max(.08,Math.sin(a)*.5+.5);sun.intensity=.25+d*1.2;const sky=new THREE.Color().setHSL(.58,.55,.22+d*.22);scene.background.copy(sky);scene.fog.color.copy(sky);document.querySelector('#clock').textContent=`${String(Math.floor(worldTime/60)%24).padStart(2,'0')}:${String(Math.floor(worldTime%60)).padStart(2,'0')}`}
let toastTimer=0;function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;toastTimer=1.3}function saveWorld(){localStorage.setItem('vf-player',JSON.stringify({x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.yaw,pitch:player.pitch}));toast('Player position saved')}
const saved=localStorage.getItem('vf-player');if(saved)try{const p=JSON.parse(saved);player.pos.set(p.x,p.y,p.z);player.yaw=p.yaw||Math.PI;player.pitch=p.pitch||0}catch{}
let last=performance.now(),fpsT=0,fpsFrames=0;function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;move(dt);world.stream(player.pos.x,player.pos.z);mine(dt);dayNight(dt);const h=hit(),tar=document.querySelector('#target');if(h){tar.style.display='block';const p=h.point.clone().addScaledVector(h.face.normal,-.001);tar.textContent=names[world.getBlock(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z))]||'Block'}else tar.style.display='none';if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.querySelector('#toast').style.opacity=0}fpsFrames++;fpsT+=dt;if(fpsT>.5){document.querySelector('#fps').textContent=Math.round(fpsFrames/fpsT);fpsT=0;fpsFrames=0;document.querySelector('#chunks').textContent=world.chunks.size}renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('beforeunload',saveWorld);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
